<section class="metrics-component metrics-card metrics-inventory" id="metrics-inventory" data-metrics-component="inventory">
  <div class="metrics-card-header metrics-inventory-header">
    <div class="metrics-card-title-group inventory-title-group">
      <h2>{{#if title}}{{title}}{{/if}}</h2>
      <p class="metrics-card-subtitle" data-metric-field="count">Loading asset catalog…</p>
    </div>
    <div class="metrics-card-controls inventory-controls-group">
      <div class="metrics-filter-group">
        <button class="metrics-chip active" data-metrics-filter="all" type="button">All</button>
        <button class="metrics-chip" data-metrics-filter="frame0" type="button">Frame‑0</button>
        <button class="metrics-chip" data-metrics-filter="html" type="button">HTML</button>
        <button class="metrics-chip" data-metrics-filter="css" type="button">CSS</button>
        <button class="metrics-chip" data-metrics-filter="js" type="button">JS</button>
        <button class="metrics-chip" data-metrics-filter="fonts" type="button">Fonts</button>
        <button class="metrics-chip" data-metrics-filter="bin" type="button">Binary</button>
      </div>
      <div class="search-input-wrap">
        <input class="metrics-inventory-search search-input" data-metrics-search type="search" placeholder="Filter assets by path or MIME…">
      </div>
    </div>
  </div>
  <div class="table-wrapper">
    <table class="ledger-table m3-table" data-metrics-table>
      <thead>
        <tr>
          <th data-metrics-sort="path">File path</th>
          <th data-metrics-sort="mime">MIME format</th>
          <th data-metrics-sort="raw_bytes">Raw bytes</th>
          <th data-metrics-sort="gzip_bytes">Gzip wire</th>
          <th data-metrics-sort="brotli_bytes">Brotli wire</th>
          <th data-metrics-sort="savings">Savings</th>
          <th data-metrics-sort="frame0">Frame‑0</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="7">Loading asset inventory…</td></tr>
      </tbody>
    </table>
  </div>
</section>
