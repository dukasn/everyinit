<div class="code-surface"{{data_language}}>
  <div class="code-header">
    <div class="code-heading">
      <span class="code-title">{{display_title}}</span>
      <span class="lang-label">{{display_language}}</span>
    </div>
    <div class="code-actions">
      <button class="icon-btn btn-download" type="button" aria-label="Download code" title="Download code" data-action="code:download" data-extension="{{extension}}" data-language="{{display_language}}">
        <svg class="docs-icon" aria-hidden="true"><use href="#icon-download"></use></svg>
      </button>
      <button class="icon-btn btn-copy" type="button" aria-label="Copy code" title="Copy code" data-action="code:copy">
        <svg class="docs-icon icon-copy" aria-hidden="true"><use href="#icon-copy"></use></svg>
        <svg class="docs-icon icon-check" aria-hidden="true"><use href="#icon-check"></use></svg>
      </button>
    </div>
  </div>
  <div class="code-scroll">
    <pre><code>{{code}}</code></pre>
  </div>
</div>
