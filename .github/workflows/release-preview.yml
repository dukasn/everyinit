name: Publish unstable preview

on:
  workflow_run:
    workflows: [Release Candidate]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: release-mirror
  cancel-in-progress: false

jobs:
  preview:
    name: Publish and verify unstable preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: unstable
    steps:
      - name: Find the pull request and create its required preview check
        id: discover
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: run.head_sha,
            });
            const pr = associated.data.find((item) =>
              item.base.ref === "main" && item.head.sha === run.head_sha
            );
            if (!pr) {
              core.setOutput("candidate", "false");
              return;
            }
            const hasLabel = pr.labels.some((label) => label.name === "release-candidate");
            async function workspaceVersion(ref) {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ".evin/workspace.flow",
                ref,
              });
              const source = Buffer.from(response.data.content, "base64").toString("utf8");
              return /^\s+version:\s*"([^"]+)"/m.exec(source)?.[1] ?? null;
            }
            const [headVersion, baseVersion] = await Promise.all([
              workspaceVersion(pr.head.sha),
              workspaceVersion(pr.base.sha),
            ]);
            const isCandidate = hasLabel || (headVersion !== null && headVersion !== baseVersion);
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Unstable preview",
              head_sha: run.head_sha,
              status: isCandidate ? "in_progress" : "completed",
              ...(isCandidate ? {} : { conclusion: "success" }),
              output: {
                title: isCandidate ? "Publishing the release candidate preview" : "Not a release candidate",
                summary: isCandidate
                  ? "Building and checking the public unstable mirror entry."
                  : "No release-candidate label or changed workspace version was detected; no preview is required.",
              },
            });
            core.setOutput("candidate", String(isCandidate));
            core.setOutput("pr", String(pr.number));
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("check_id", String(check.data.id));
      - uses: actions/checkout@v7
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@1.98.0
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
      - uses: Swatinem/rust-cache@v2
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
      - name: Fetch the candidate commit and tags
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          PR_NUMBER: ${{ steps.discover.outputs.pr }}
        run: |
          git fetch origin "refs/pull/$PR_NUMBER/head:refs/remotes/origin/release-candidate"
          git fetch --tags origin
      - name: Validate the exact tagged candidate using trusted release tooling
        id: candidate
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          RELEASE_COMMIT: ${{ steps.discover.outputs.head_sha }}
          RELEASE_BASE_SHA: ${{ steps.discover.outputs.base_sha }}
        run: node scripts/release/validate-candidate.mjs auto auto "$RELEASE_COMMIT" "$RELEASE_BASE_SHA"
      - name: Download candidate archives from the successful PR build
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ steps.discover.outputs.head_sha }}
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Stage only the expected Evin and ESH tarballs
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        run: node scripts/release/stage-candidate-artifacts.mjs "$RUNNER_TEMP/release-candidate" "${{ steps.candidate.outputs.version }}"
      - name: Generate signed unstable metadata from the downloaded archives
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          RELEASE_CHANNEL: unstable
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_SIGNING_KEY: ${{ secrets.EVERYINIT_RELEASE_SIGNING_KEY }}
          RELEASE_TARGET: x86_64-unknown-linux-musl
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_LABEL: ${{ steps.candidate.outputs.label }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "EVERYINIT_RELEASE_SIGNING_KEY is required to sign preview metadata" >&2; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/everyinit-release-signing-key.pem"
          export RELEASE_SIGNING_KEY_FILE="$RUNNER_TEMP/everyinit-release-signing-key.pem"
          node scripts/release/metadata.mjs evin "$RELEASE_CHANNEL" "$RELEASE_VERSION" "$RELEASE_TARGET" dist/mirror crates/evin/dist/github "$RELEASE_LABEL"
          node scripts/release/metadata.mjs esh "$RELEASE_CHANNEL" "$RELEASE_VERSION" "$RELEASE_TARGET" dist/mirror crates/esh/dist/github "$RELEASE_LABEL"
          node scripts/release/channel-manifest.mjs "$RELEASE_CHANNEL" "$RELEASE_VERSION" "$RELEASE_TARGET" dist/mirror
      - name: Install locked Wrangler dependencies
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        run: npm ci
      - name: Upload immutable preview objects to R2
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          RELEASE_CHANNEL: unstable
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare R2 credentials are required" >&2; exit 1; }
          node scripts/release/publish-mirror.mjs "$RELEASE_CHANNEL" "$RELEASE_VERSION" objects dist/mirror
      - name: Fetch and verify the preview through the public mirror
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          RELEASE_CHANNEL: unstable
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_LABEL: ${{ steps.candidate.outputs.label }}
          RELEASE_TARGET: x86_64-unknown-linux-musl
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          node scripts/release/verify-mirror-candidate.mjs "$RELEASE_CHANNEL" "$RELEASE_VERSION" "$RELEASE_COMMIT" "$RELEASE_LABEL"
          cargo run --locked -p esh -- scripts/release/verify-archive.esh evin "$RELEASE_TARGET" "$RELEASE_VERSION" crates/evin/dist/github
          cargo run --locked -p esh -- scripts/release/verify-archive.esh esh "$RELEASE_TARGET" "$RELEASE_VERSION" crates/esh/dist/github
          prefix="$RUNNER_TEMP/unstable-install"
          sh infra/get/src/installer.sh --package all --channel unstable --version "$RELEASE_VERSION" --prefix "$prefix"
          "$prefix/bin/evin" --version | grep -F "$RELEASE_VERSION"
          "$prefix/bin/esh" --version | grep -F "$RELEASE_VERSION"
      - name: Point unstable at the verified candidate and verify both pointers
        if: steps.discover.outputs.candidate == 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          RELEASE_CHANNEL: unstable
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_LABEL: ${{ steps.candidate.outputs.label }}
        run: |
          node scripts/release/publish-mirror.mjs "$RELEASE_CHANNEL" "$RELEASE_VERSION" pointers dist/mirror
          node scripts/release/verify-mirror-candidate.mjs "$RELEASE_CHANNEL" "$RELEASE_VERSION" "$RELEASE_COMMIT" "$RELEASE_LABEL" --check-pointer
      - name: Complete the required unstable preview check
        if: always() && steps.discover.outputs.check_id != ''
        uses: actions/github-script@v8
        env:
          CHECK_ID: ${{ steps.discover.outputs.check_id }}
          JOB_STATUS: ${{ job.status }}
          CANDIDATE: ${{ steps.discover.outputs.candidate }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            // Ordinary PRs already received a successful check during discovery.
            // Their skipped build must not overwrite that result with failure.
            if (process.env.CANDIDATE !== "true") return;
            const conclusion = process.env.JOB_STATUS === "success" && process.env.SOURCE_CONCLUSION === "success" ? "success"
              : process.env.JOB_STATUS === "cancelled" ? "cancelled" : "failure";
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: "completed",
              conclusion,
              output: {
                title: conclusion === "success" ? "Unstable preview is reachable and installable" : "Unstable preview validation failed",
                summary: `Candidate build: ${process.env.SOURCE_CONCLUSION}; preview job: ${process.env.JOB_STATUS}. See this workflow run for details.`,
              },
            });
