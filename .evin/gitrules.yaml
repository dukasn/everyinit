#   allowed_emails: []
#   policies:
#     # Require commits to be cryptographically signed (GPG/SSH).
#     require_signatures: false
#     # Prevent users from forging commit authorship details.
#     block_identity_forging: false

files:
  # Optional naming convention for files (e.g. 'snake_case', 'camelCase').
  naming_convention: null
  # Ignore specific files from validation.
  ignore: []
  # Define content rules for specific files.
  content_rules:
    - name: "rust-license-header"
      include: ["*.rs", "**/*.rs"]
      require_pattern: "(?m)^// Copyright \\(C\\)"
      error_message: "Rust source file missing required license header."
  policies:
    # Block certain file paths entirely.
    block_paths: []


lfs:
  policies:
    # File extensions that MUST be tracked by Git LFS.
    require_tracking_for: [".psd", ".mp4", ".zip", ".tar.gz", ".mov"]
    # Enforce that Git LFS is installed and initialized.
    require_lfs_installed: false

submodules:
  policies:
    # Allow creating submodules in this repository?
    allow_creation: false
    # Allowed hosts for submodules (e.g. github.com).
    allowed_hosts: []

remotes:
  policies:
    # Restrict which remotes are allowed for pushes.
    allowed_push_remotes: ["origin"]
    # Prevent force pushing to these branches.
    block_force_push: []
    # Enforce pulling before pushing? Set to false for early development.
    require_up_to_date: false
