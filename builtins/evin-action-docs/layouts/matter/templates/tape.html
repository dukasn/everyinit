<figure class="terminal-tape">
  <div class="tape-header">
    <div class="tape-heading">
      <span class="tape-title">{{title}}</span>
      <span class="tape-runtime" aria-label="Runtime: {{runtime_label}}">{{runtime_label}}</span>
    </div>
    <div class="tape-actions">
      <button class="icon-btn tape-playback" type="button" aria-label="Pause playback" aria-pressed="false" title="Pause playback" data-action="tape:toggle-playback">
        <svg class="docs-icon icon-pause" aria-hidden="true"><use href="#icon-player-pause"></use></svg>
        <svg class="docs-icon icon-play" aria-hidden="true"><use href="#icon-player-play"></use></svg>
      </button>
      <button class="icon-btn tape-copy" type="button" aria-label="Copy commands as a shell script" title="Copy commands as a shell script" data-action="tape:copy" {{copy_disabled}}>
        <svg class="docs-icon icon-copy" aria-hidden="true"><use href="#icon-copy"></use></svg>
        <svg class="docs-icon icon-check" aria-hidden="true"><use href="#icon-check"></use></svg>
      </button>
    </div>
  </div>
  <template class="tape-copy-script">{{copy_script}}</template>
  <div class="tape-stage">{{svg}}</div>
</figure>
