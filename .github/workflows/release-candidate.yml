name: Release Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  candidate:
    name: Build tagged release candidate
    if: contains(github.event.pull_request.labels.*.name, 'release-candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      RELEASE_TARGET: x86_64-unknown-linux-musl
      RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      RELEASE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl package tooling
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Resolve and validate candidate identity
        id: candidate
        run: |
          RELEASE_VERSION="$(node scripts/release/workspace-version.mjs)"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"
          node scripts/release/validate-candidate.mjs auto auto "$RELEASE_COMMIT" "$RELEASE_BASE_SHA"
      - name: Build and verify both mirror archives
        run: cargo evin-dev run release:package-cloudflare-verify
      - name: Preserve the exact verified candidate archives
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            crates/evin/dist/github/evin-v${{ steps.candidate.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            crates/esh/dist/github/esh-v${{ steps.candidate.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
          if-no-files-found: error
          retention-days: 30
