name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit to retry (must have successful main push CI)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-automation
  cancel-in-progress: false

jobs:
  release:
    name: Reconcile release and proposal
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
      RELEASE_COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha }}
      RELEASE_BRANCH: automation/release
      RELEASE_TARGET: x86_64-unknown-linux-musl
      RELEASE_CHANNEL: canary
      RELEASE_BASE_URL: https://dl.everyinit.dev
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Require release bot token
        run: test -n "$GITHUB_TOKEN" || { echo 'RELEASE_BOT_TOKEN is required to trigger pull request CI' >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
      - name: Load the current release publishers
        run: |
          git fetch origin main --no-tags
          git checkout origin/main -- scripts/release/mirror/publish.esh scripts/release/npm/publish.esh
      - uses: jdx/mise-action@v5
        with:
          cache: false
        env:
          MISE_ENABLE_TOOLS: rust
          MISE_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS: rust
      - uses: Swatinem/rust-cache@v2
      - name: Require exact successful main push CI
        run: cargo evin-dev run --verbose release:require-ci
      - name: Identify merged release proposal
        id: proposal
        run: cargo evin-dev run --verbose release:identify-proposal
      - name: Install release packaging tools
        if: steps.proposal.outputs.merged == '1'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools zstd
      - name: Install the release Rust target
        if: steps.proposal.outputs.merged == '1'
        run: rustup target add x86_64-unknown-linux-musl
      - uses: jdx/mise-action@v5
        if: steps.proposal.outputs.merged == '1'
        with:
          cache: false
        env:
          MISE_ENABLE_TOOLS: node,npm
          MISE_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS: node,npm
      - name: Bootstrap locked workspace dependencies
        if: steps.proposal.outputs.merged == '1'
        run: |
          npm ci
          npm --prefix editors/vscode ci
      - name: Determine release version
        if: steps.proposal.outputs.merged == '1'
        run: cargo evin-dev run --verbose release:resolve-version
      - name: Extract merged release notes with Evin
        if: steps.proposal.outputs.merged == '1'
        run: cargo evin-dev run --verbose release:release-notes
      - name: Build and verify release archives with Evin
        if: steps.proposal.outputs.merged == '1'
        env:
          EVERYINIT_RELEASE_SIGNING_KEY: ${{ secrets.EVERYINIT_RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_KEY: ${{ secrets.EVERYINIT_RELEASE_SIGNING_KEY || secrets.RELEASE_SIGNING_KEY }}
        run: cargo evin-dev run --verbose release:release-archives-verify
      - name: Build and verify the Cloudflare mirror archives
        if: steps.proposal.outputs.merged == '1'
        run: cargo evin-dev run --verbose release:package-cloudflare-verify
      - name: Prepare the mirror signing key
        if: steps.proposal.outputs.merged == '1'
        env:
          SIGNING_KEY: ${{ secrets.EVERYINIT_RELEASE_SIGNING_KEY || secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'A release signing key is required to publish the R2 mirror' >&2; exit 1; }
          key_file="$RUNNER_TEMP/everyinit-release-signing-key.pem"
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$key_file"
          echo "RELEASE_SIGNING_KEY_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Publish immutable artifacts to R2
        if: steps.proposal.outputs.merged == '1'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: cargo evin-dev run --verbose infra:mirror:publish-objects
      - name: Tag and publish the merged release
        if: steps.proposal.outputs.merged == '1'
        run: cargo evin-dev run --verbose release:publish-merged
      - name: Publish the canary channel pointer to R2
        if: steps.proposal.outputs.merged == '1'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: cargo run --locked -p esh -- scripts/release/mirror/publish.esh canary "$RELEASE_VERSION" pointers dist/mirror
      - name: Use npm CLI with trusted publishing support
        if: steps.proposal.outputs.merged == '1'
        run: npm install --global npm@11.5.1
      - name: Configure GitHub Packages authentication
        if: steps.proposal.outputs.merged == '1'
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          registry-url: https://npm.pkg.github.com
          scope: '@dukasn'
          package-manager-cache: false
      - name: Publish the npm package to both registries
        if: steps.proposal.outputs.merged == '1'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: cargo evin-dev run --verbose release:publish-registries
      - name: Require merged releases to be published before proposing
        run: cargo evin-dev run --verbose release:audit-published
      - name: Maintain the release pull request
        run: cargo evin-dev run --verbose release:reconcile-proposal
