module:
  name: docs

values:
  site_title: "EVIN Workflow Engine"
  site_url: "https://dukasn.github.io/evin/"

tasks:
  catalog:
    stage: Docs
    description: "Generate the tracked ESH runtime catalog intentionally"
    needs: [main:build]
    steps:
      - uses: evin/docs@v1
        with:
          target: lsp
          title: "${site_title}"
          site_url: "${site_url}"
          source_dir: docs/reference/esh
          include: [100.runtime-reference.3010.md]
          out: crates/esh/assets/builtins-catalog.json

  build:
    stage: Docs
    description: "Generate the static documentation site and audit links"
    needs: [main:build]
    on:
      hooks: [pre-commit]
    steps:
      - uses: evin/docs@v1
        with:
          title: "${site_title}"
          site_url: "${site_url}"
          strict_filenames: true
          metrics: true
          metrics_budget_kb: 110

  test-responsive:
    stage: Docs
    description: "Run Chromium documentation responsiveness checks"
    cwd: .
    needs: [build]
    steps:
      - run: npx playwright test

  verify:
    stage: Docs
    description: "Build and validate documentation in Chromium"
    needs: [test-responsive]

  serve:
    stage: Docs
    description: "Serve the live-reloading documentation site"
    needs: [main:build]
    watch:
      paths:
        - crates/**
        - builtins/**
        - Cargo.toml
        - Cargo.lock
      debounce: 300ms
    steps:
      - uses: evin/docs@v1
        with:
          mode: serve
          title: "${site_title}"
          site_url: "${site_url}"
          strict_filenames: true
          metrics: true
          metrics_budget_kb: 110
