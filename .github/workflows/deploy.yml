name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, release]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site and Workers
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'release' || 'unstable' }}
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: jdx/mise-action@v5
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Select the token for this deployment environment
        env:
          PRODUCTION_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_DEPLOY_API_TOKEN }}
        run: |
          if [ "$SITE_BRANCH" = main ]; then
            token="$PRODUCTION_TOKEN"
          else
            token="$PREVIEW_TOKEN"
          fi
          test -n "$token" || { echo 'Cloudflare API token is missing from the selected GitHub environment' >&2; exit 1; }
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Build and deploy the site
        run: cargo evin-dev run infra:deploy:site
      - name: Deploy production Workers
        if: github.event.workflow_run.head_branch == 'main'
        run: cargo evin-dev run infra:deploy:workers
