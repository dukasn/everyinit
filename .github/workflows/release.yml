name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit to retry (must have successful main push CI)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-automation
  cancel-in-progress: false

jobs:
  release:
    name: Reconcile release and proposal
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
      RELEASE_COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha }}
      RELEASE_BRANCH: automation/release
      RELEASE_TARGET: x86_64-unknown-linux-musl
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Require release bot token
        run: test -n "$GITHUB_TOKEN" || { echo 'RELEASE_BOT_TOKEN is required to trigger pull request CI' >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Require exact successful main push CI
        run: cargo evin-dev run release:require-ci
      - name: Identify merged release proposal
        id: proposal
        run: cargo evin-dev run release:identify-proposal
      - name: Install release packaging tools
        if: steps.proposal.outputs.merged == '1'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools zstd
      - uses: actions/setup-node@v4
        if: steps.proposal.outputs.merged == '1'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editors/vscode/package-lock.json
      - name: Bootstrap locked workspace dependencies
        if: steps.proposal.outputs.merged == '1'
        run: |
          npm ci
          npm --prefix editors/vscode ci
      - name: Determine release version
        if: steps.proposal.outputs.merged == '1'
        run: cargo evin-dev run release:resolve-version
      - name: Extract merged release notes with Evin
        if: steps.proposal.outputs.merged == '1'
        run: cargo evin-dev run release:release-notes
      - name: Build and verify release archives with Evin
        if: steps.proposal.outputs.merged == '1'
        env:
          EVERYINIT_RELEASE_SIGNING_KEY: ${{ secrets.EVERYINIT_RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_KEY: ${{ secrets.EVERYINIT_RELEASE_SIGNING_KEY || secrets.RELEASE_SIGNING_KEY }}
        run: cargo evin-dev run release:release-archives-verify
      - name: Tag and publish the merged release
        if: steps.proposal.outputs.merged == '1'
        run: cargo evin-dev run release:publish-merged
      - name: Require merged releases to be published before proposing
        run: cargo evin-dev run release:audit-published
      - name: Maintain the release pull request
        run: cargo evin-dev run release:reconcile-proposal
