#!evin/v1
workspace:
  name: main
  version: "1.0.0-canary.100"
  rules: ".evin/gitrules.yaml"
  install_hint: "cargo install --path crates/evin"
  hook_runner:
    command: cargo
    args: [evin-dev]
  modules:
    - docs/
    - crates/evin/
    - crates/esh/
  include:
    - .evin/release.yaml

stages:
  - Build
  - Check
  - Test
  - Docs
  - Publish

tasks:
  build:
    stage: Build
    description: "Build the complete Rust workspace"
    presets: [rust]
    steps:
      - run: cargo build --workspace --locked

  check:
    stage: Check
    description: "Check every workspace target"
    presets: [rust]
    steps:
      - run: cargo check --workspace --all-targets --locked

  fmt:
    stage: Check
    description: "Enforce workspace Rust formatting"
    presets: [rust]
    on:
      hooks: [pre-commit]
    steps:
      - run: cargo fmt --all -- --check

  lint:
    stage: Check
    description: "Run strict Clippy across every workspace target"
    presets: [rust]
    on:
      hooks: [pre-commit]
    steps:
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    stage: Test
    description: "Run the locked workspace test suite"
    presets: [rust]
    on:
      hooks: [pre-commit]
    steps:
      - run: cargo test --workspace --locked

  e2e:
    stage: Test
    description: "Run cross-platform EVIN and ESH binary tests"
    needs:
      - evin:e2e
      - esh:e2e

  quality:
    stage: Check
    description: "Run static Rust and browser documentation quality checks"
    needs:
      - check
      - fmt
      - lint
      - docs:verify

  verify:
    stage: Test
    description: "Run the complete local validation gate"
    needs:
      - quality
      - test

  soak:
    stage: Test
    description: "Run the ignored process-supervision soak suite"
    presets: [rust]
    steps:
      - run: cargo test -p evin-process --test soak --locked -- --ignored --test-threads=1

  doctor:
    stage: Check
    description: "Report contributor prerequisite availability"
    steps:
      - run: cargo run --locked -p esh -- scripts/maintenance/doctor.esh

  bootstrap:
    stage: Build
    description: "Install locked repository dependencies and synchronize hooks"
    steps:
      - run: cargo fetch --locked
      - run: npm ci
      - run: npx playwright install chromium
      - run: cargo evin-dev sync
