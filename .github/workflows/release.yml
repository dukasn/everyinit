name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit to retry (must have successful main push CI)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-automation
  cancel-in-progress: false

jobs:
  release:
    name: Reconcile release and proposal
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
      RELEASE_COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha }}
      RELEASE_BRANCH: automation/release
      RELEASE_TARGET: x86_64-unknown-linux-musl
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Require release bot token
        run: test -n "$GITHUB_TOKEN" || { echo 'RELEASE_BOT_TOKEN is required to trigger pull request CI' >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
      - name: Require exact successful main push CI
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full commit SHA' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$RELEASE_COMMIT&per_page=100" --jq '.workflow_runs[]' | jq -s '[.[] | select(.head_sha == env.RELEASE_COMMIT and .head_branch == "main" and .event == "push")] | sort_by(.id) | last')"
          test "$(jq -r '.status' <<< "$runs")" = completed
          test "$(jq -r '.conclusion' <<< "$runs")" = success
          run_id="$(jq -r '.id' <<< "$runs")"
          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[]' | jq -s '.')"
          jq -e 'all(["Linux validation (quality, tests, E2E, distribution)", "CI gate"][]; . as $name | any($jobs[]; .name == $name and .status == "completed" and .conclusion == "success"))' --argjson jobs "$jobs" <<< 'null' >/dev/null
      - name: Identify merged release proposal
        id: proposal
        run: |
          set -euo pipefail
          count="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT/pulls?per_page=100" --jq '.[]' | jq -s '[.[] | select(.base.ref == "main" and .head.ref == env.RELEASE_BRANCH and .head.repo.full_name == env.GITHUB_REPOSITORY and .merged_at != null and .merge_commit_sha == env.RELEASE_COMMIT)] | length')"
          if [ "$count" -gt 1 ]; then echo 'Ambiguous release proposal' >&2; exit 1; fi
          echo "merged=$count" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl linker
        if: steps.proposal.outputs.merged == '1'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Determine release version
        if: steps.proposal.outputs.merged == '1'
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid stable release version' >&2; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
      - name: Build and verify release archives with Evin
        if: steps.proposal.outputs.merged == '1'
        run: cargo evin-dev run release:release-archives-verify
      - name: Tag and publish the merged release
        if: steps.proposal.outputs.merged == '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag || { echo 'Existing release tag is not annotated' >&2; exit 1; }
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$RELEASE_COMMIT" || { echo 'Release tag points to another commit; resolve manually' >&2; exit 1; }
          else
            git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s '[.[] | select(.tag_name == env.RELEASE_TAG)]')"
          count="$(jq 'length' <<< "$releases")"
          if [ "$count" -ne 0 ]; then
            if jq -e 'length == 1 and .[0].draft == false and ([.[0].assets[].name] | index("evin-" + env.RELEASE_TAG + "-" + env.RELEASE_TARGET + ".tar.gz") != null and index("esh-" + env.RELEASE_TAG + "-" + env.RELEASE_TARGET + ".tar.gz") != null)' <<< "$releases" >/dev/null; then
              echo 'Release already published with both assets; nothing to do.'
              exit 0
            fi
            echo 'Existing draft or incomplete release: inspect and repair or remove it before retrying.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes \
            "target/release-archives/evin-$RELEASE_TAG-$RELEASE_TARGET.tar.gz" \
            "target/release-archives/esh-$RELEASE_TAG-$RELEASE_TARGET.tar.gz"
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Require merged releases to be published before proposing
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          if [ "$(git rev-parse origin/main)" != "$RELEASE_COMMIT" ]; then
            echo 'Main advanced; its own CI run will maintain the proposal.'
            exit 0
          fi
          merges="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" --jq '.[]' | jq -sr '[.[] | select(.base.ref == "main" and .head.ref == env.RELEASE_BRANCH and .head.repo.full_name == env.GITHUB_REPOSITORY and .merged_at != null and .merge_commit_sha != null) | .merge_commit_sha] | unique[]')"
          if [ -z "$merges" ]; then exit 0; fi
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s '.')"
          while IFS= read -r merge; do
            if ! git cat-file -e "$merge^{commit}"; then
              echo "Cannot inspect merged release commit $merge" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$merge" "$RELEASE_COMMIT"; then continue; fi
            version="$(git show "$merge:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')"
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Invalid version at merged release $merge" >&2; exit 1; }
            tag="v$version"
            if ! git show-ref --verify --quiet "refs/tags/$tag" ||
               [ "$(git cat-file -t "refs/tags/$tag")" != tag ] ||
               [ "$(git rev-parse "refs/tags/$tag^{}")" != "$merge" ]; then
              echo "Merged release $merge is not tagged correctly as $tag; retry Release for that SHA before proposing." >&2
              exit 1
            fi
            if ! jq -e --arg tag "$tag" 'any(.[]; .tag_name == $tag and .draft == false and ([.assets[].name] | index("evin-" + $tag + "-" + env.RELEASE_TARGET + ".tar.gz") != null and index("esh-" + $tag + "-" + env.RELEASE_TARGET + ".tar.gz") != null))' <<< "$releases" >/dev/null; then
              echo "Merged release $merge ($tag) is not fully published; repair or retry it before proposing." >&2
              exit 1
            fi
          done <<< "$merges"
      - name: Maintain the release pull request
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          if [ "$(git rev-parse origin/main)" != "$RELEASE_COMMIT" ]; then
            echo 'Main advanced; its own CI run will maintain the proposal.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config commit.gpgsign false
          git switch --force-create "$RELEASE_BRANCH" "$RELEASE_COMMIT"
          cargo evin-dev run release:propose
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$RELEASE_COMMIT" ]; then
            pr="$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
            if [ -n "$pr" ]; then
              gh pr close "$pr" --comment "Main advanced during release reconciliation; the latest main run will recreate the proposal if appropriate."
            fi
            echo 'Main advanced during proposal reconciliation; retry after its CI completes.' >&2
            exit 1
          fi
