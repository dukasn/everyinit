version: 1
name: Git Development Standard (Canary)

commits:
  # The conventional commit format used for all commit messages.
  # Can be a single string or an array of acceptable formats.
  message_format:
    - "{type}({scope}?){breaking?}: {description}"
    - "{type}: {description}"

  # Commits matching these regex patterns will bypass validation.
  ignore_patterns:
    - "^Merge branch"
    - "^Revert"

  # Enforce specific rules for different named capturing groups in your format.
  fields:
    type:
      # The allowed semantic commit types.
      allowed_values: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
      # Enforce a specific casing style.
      must_be: lowercase-with-hyphens
    description:
      max_length: 72

  policies:
    # Do we require a commit body?
    require_body: false
    # Do we require an issue tracker link in the footer?
    require_ticket_reference: false

releases:
  # Define how different commit types impact the semantic version bump and the changelog.
  change_types:
    feat:
      bump: minor
      changelog_section: Features
    fix:
      bump: patch
      changelog_section: Bug Fixes
    chore:
      bump: patch
      changelog_section: Maintenance
    test:
      bump: patch
      changelog_section: Tests
    docs:
      bump: patch
      changelog_section: Documentation
    refactor:
      bump: patch
      changelog_section: Refactoring
    perf:
      bump: patch
      changelog_section: Performance Improvements

  commit_message: "chore(release): {version}"

branches:
  # The format required for branch names.
  name_format:
    - "{type}/{ticket}-{description}"
    - "{type}/{description}"

  fields:
    type:
      allowed_values: [feat, fix, chore, docs, refactor, release]
      must_be: lowercase-with-hyphens
    description:
      must_be: lowercase-with-hyphens

  policies:
    # Block direct push to the main branch? (Set to false for early development).
    block_push_to_main: false

tags:
  # Format for git tags (usually semantic versioning prefixed with 'v').
  name_format: "v{version}"
  policies:
    # Require annotated tags instead of lightweight tags?
    require_annotated: true
    # Block deletion of existing tags?
    block_deletion: true

pull_requests:
  # Expected format for the Pull Request title.
  title_format: "{type}({scope}?): {description}"
  policies:
    # Require the PR to have at least one assignee?
    require_assignee: false
    # Require the PR to link to an issue?
    require_linked_issue: false
    # Block PRs that have WIP prefixes (e.g. 'WIP:', 'draft:')?
    block_wip_prefixes: ["WIP:", "draft:", "wip:"]

# history:
