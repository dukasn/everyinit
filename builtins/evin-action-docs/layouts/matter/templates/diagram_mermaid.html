<figure class="evin-diagram-figure evindoc-mermaid"{{id_attr}}{{alt_attr}}>
  <div class="code-header diagram-header">
    <span class="lang-label diagram-label">{{display_title}}</span>
    <div class="code-actions diagram-actions">
      <button class="icon-btn btn-download" type="button" aria-label="Download diagram" title="Download diagram" data-action="diagram:download" data-format="mermaid" data-filename="{{filename}}">
        <svg class="evin-icon" aria-hidden="true"><use href="#icon-download"></use></svg>
      </button>
      <button class="icon-btn btn-copy" type="button" aria-label="Copy diagram code" title="Copy diagram code" data-action="diagram:copy">
        <svg class="evin-icon" aria-hidden="true"><use href="#icon-copy"></use></svg>
      </button>
    </div>
  </div>
  <div class="evin-diagram-container">
    <pre class="mermaid" data-processed="false">{{code}}</pre>
  </div>
  {{caption_html}}
</figure>
