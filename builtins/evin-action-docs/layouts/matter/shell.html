<!DOCTYPE html>
<html lang="<page-language></page-language>" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <page-title></page-title>
    <page-meta></page-meta>
    <favicons></favicons>
    <font-preloads></font-preloads>
    <depth-prefix></depth-prefix>
    <json-ld></json-ld>

    <script>
        (() => {
            const theme = localStorage.getItem('m3-theme') ||
                localStorage.getItem('m3-docs-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <style id="matter-theme-shield">
        :root {
            color-scheme: dark;
            --ui-color-background: #090a0d;
            --ui-color-on-background: #f4f6f8;
        }
        html[data-theme="dark"] {
            color-scheme: dark;
            --ui-color-background: #090a0d;
            --ui-color-on-background: #f4f6f8;
        }
        html[data-theme="light"] {
            color-scheme: light;
            --ui-color-background: #ffffff;
            --ui-color-on-background: #17191d;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--ui-color-background) !important;
            color: var(--ui-color-on-background);
        }

        /* Hold body invisible until theme.css is parsed */
        body {
            opacity: 0;
            transition: opacity 160ms ease-out;
        }

        /* Smooth full-page fade in */
        html.theme-ready body {
            opacity: 1;
        }

        /* Instant reveal when reduced motion is requested */
        @media (prefers-reduced-motion: reduce) {
            body {
                opacity: 1 !important;
                transition: none !important;
            }
        }

        /* Guard against unstyled native dialogs appearing before CSS */
        dialog:not([open]) { display: none !important; }
    </style>
    <noscript><style>body { opacity: 1 !important; }</style></noscript>

    <css></css>

    <script>
        /* Failsafe timeout: reveal content after 1.5s if network stalls */
        setTimeout(() => document.documentElement.classList.add('theme-ready'), 1500);
    </script>
</head>
<body data-page-kind="<page-kind></page-kind>">
    <icons-sprite></icons-sprite>
    <topbar></topbar>

    <header class="header-toolbar site-header">
        <button id="sidebarToggle" class="icon-btn sidebar-toggle-btn" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Open navigation" data-action="sidebar:toggle">
            <svg class="docs-icon sidebar-icon sidebar-icon-default control-icon-motion" aria-hidden="true"><use href="#icon-layout-sidebar"></use></svg>
            <svg class="docs-icon sidebar-icon sidebar-icon-collapse control-icon-motion" aria-hidden="true"><use href="#icon-layout-sidebar-left-collapse"></use></svg>
            <svg class="docs-icon sidebar-icon sidebar-icon-expand control-icon-motion" aria-hidden="true"><use href="#icon-layout-sidebar-left-expand"></use></svg>
        </button>
        <a class="site-brand" href="<home-href></home-href>" aria-label="Documentation home">
            <brand-logo></brand-logo>
            <span><site-brand></site-brand></span>
        </a>
        <div class="site-header-actions">
            <button id="searchToggle" class="search-trigger" type="button" aria-haspopup="dialog" aria-controls="searchModal" aria-label="Search documentation" title="Search (Ctrl+K)" data-action="search:open">
                <svg class="docs-icon control-icon-motion" aria-hidden="true"><use href="#icon-search"></use></svg>
                <span class="search-trigger-label">Search...</span>
                <kbd class="search-kbd">⌘K</kbd>
            </button>
            <button id="themeToggle" class="icon-btn theme-toggle-btn" type="button" aria-label="Toggle color theme" title="Toggle theme" data-action="theme:toggle">
                <svg class="docs-icon theme-icon theme-icon-sun" aria-hidden="true"><use href="#icon-brightness-up"></use></svg>
                <svg class="docs-icon theme-icon theme-icon-moon" aria-hidden="true"><use href="#icon-moon"></use></svg>
                <svg class="docs-icon theme-icon-frame" aria-hidden="true"><use href="#icon-sun-moon"></use></svg>
            </button>
        </div>
    </header>

    <dialog id="searchModal" class="m3-dialog dialog-wide" aria-label="Search documentation">
        <div class="dialog-header">
            <div class="dialog-title-group">
                <svg class="docs-icon dialog-title-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
                <div class="dialog-search-field">
                    <input type="search" id="docs-search-input" class="dialog-search-input" aria-label="Search documentation" placeholder="Search documentation..." autocomplete="off">
                </div>
            </div>
            <button id="searchClose" class="icon-btn" type="button" aria-label="Close search" data-action="search:close">
                <svg class="docs-icon" aria-hidden="true"><use href="#icon-x"></use></svg>
            </button>
        </div>
        <div class="dialog-content" id="docs-search-results"></div>
        <template id="search-card-tmpl">
            <button class="dialog-item search-result-card" type="button">
                <div class="search-result-left"><svg class="docs-icon" aria-hidden="true"><use href=""></use></svg></div>
                <div class="search-result-body">
                    <div class="search-result-header">
                        <span class="search-result-title"></span>
                    </div>
                    <div class="search-result-meta"></div>
                    <div class="search-result-snippet"></div>
                </div>
            </button>
        </template>
        <template id="search-empty-tmpl">
            <div class="search-empty-state">No matches found</div>
        </template>
    </dialog>

    <div class="app-layout" id="appLayout">
        <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" tabindex="-1" aria-label="Close navigation" data-action="sidebar:close"></button>

        <aside class="sidebar" id="sidebar" aria-label="Main navigation" aria-hidden="true" tabindex="-1">
            <div class="sidebar-top">
                <a class="brand-title" href="<home-href></home-href>" aria-label="Go to <site-brand></site-brand> documentation home">
                    <brand-logo></brand-logo>
                    <span><site-brand></site-brand></span>
                </a>
            </div>

            <div class="sidebar-divider"></div>

            <nav class="sidebar-middle" aria-label="Main Navigation">
                <label class="nav-filter-wrap">
                    <svg class="docs-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
                    <input id="navFilter" class="nav-filter" type="search" placeholder="Filter pages..." autocomplete="off" aria-label="Filter pages">
                </label>
                <sidebar-nav></sidebar-nav>
            </nav>
        </aside>

        <main class="content">
            <div class="scroll-pane">
                <div class="document-layout">
                    <article class="content-inner">
                        <div class="breadcrumbs" style="margin-bottom:1rem;"><breadcrumbs></breadcrumbs></div>
                        <inline-toc></inline-toc>
                        <div class="prose">
                            <content></content>
                        </div>

                        <div class="doc-pagination-divider"></div>

                        <pagination></pagination>

                    </article>
                    <toc-rail></toc-rail>
                </div>
            </div>
        </main>
    </div>

    <search-data></search-data>
    <search-js></search-js>
    <component-js></component-js>
    <live-reload></live-reload>
</body>
</html>
