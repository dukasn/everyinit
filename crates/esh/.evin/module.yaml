module:
  name: esh

tasks:
  build:
    stage: Build
    description: "Build the ESH crate"
    presets: [rust]
    steps:
      - run: cargo build -p esh --locked

  check:
    stage: Check
    description: "Check every ESH crate target"
    presets: [rust]
    steps:
      - run: cargo check -p esh --all-targets --locked

  lint:
    stage: Check
    description: "Run strict Clippy for every ESH target"
    presets: [rust]
    steps:
      - run: cargo clippy -p esh --all-targets --locked -- -D warnings

  test:
    stage: Test
    description: "Run ESH crate tests"
    presets: [rust]
    steps:
      - run: cargo test -p esh --locked

  e2e:
    stage: Test
    description: "Run ESH binary-level integration tests"
    presets: [rust]
    steps:
      - run: cargo test -p esh --test cli_e2e --locked

  verify:
    stage: Test
    description: "Run all ESH maintenance checks"
    needs: [check, lint, test]

  lsp:
    stage: Build
    description: "Run the ESH language server over stdio"
    presets: [rust]
    steps:
      - run: cargo run --locked -p esh -- lsp
