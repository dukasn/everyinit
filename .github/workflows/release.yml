name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to build"
        required: true
        type: string
      publish:
        description: "Publish or update the GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Linux musl release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Resolve release version
        run: |
          case "$RELEASE_TAG" in
            v?*) echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV" ;;
            *) echo "Expected a v-prefixed release tag, got '$RELEASE_TAG'" >&2; exit 1 ;;
          esac
      - name: Build, verify, and package release with EVIN
        run: cargo evin-dev run release:package-verify
      - name: Publish GitHub prerelease
        if: github.event_name == 'push' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/evin-v$RELEASE_VERSION-$RELEASE_TARGET.tar.gz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" --prerelease --title "$RELEASE_TAG" --generate-notes
          fi
