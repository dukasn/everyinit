name: Platform probe

# Manual compatibility probes only; do not add these jobs to required checks.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Operating systems to probe
        required: true
        type: choice
        options:
          - both
          - windows
          - macos
        default: both

permissions:
  contents: read

env:
  MISE_ENABLE_TOOLS: rust

jobs:
  windows:
    name: Experimental Windows probe
    if: inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-platform-probe
      - name: Run exploratory workspace checks
        shell: bash
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=short
          cargo check --workspace --all-targets --locked 2>&1 | tee platform-probe.log
          cargo test --workspace --locked -- --show-output 2>&1 | tee -a platform-probe.log
      - name: Upload platform probe log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: platform-probe-windows-${{ github.run_id }}
          path: platform-probe.log
          if-no-files-found: warn

  macos:
    name: Experimental macOS probe
    if: inputs.platform == 'both' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-platform-probe
      - name: Run exploratory workspace checks
        shell: bash
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=short
          cargo check --workspace --all-targets --locked 2>&1 | tee platform-probe.log
          cargo test --workspace --locked -- --show-output 2>&1 | tee -a platform-probe.log
      - name: Upload platform probe log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: platform-probe-macos-${{ github.run_id }}
          path: platform-probe.log
          if-no-files-found: warn
