name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to build"
        required: true
        type: string
      publish:
        description: "Publish or update the GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Linux musl release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Resolve release version
        run: |
          case "$RELEASE_TAG" in
            v?*) echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV" ;;
            *) echo "Expected a v-prefixed release tag, got '$RELEASE_TAG'" >&2; exit 1 ;;
          esac
      - name: Build and verify every supported package format with EVIN
        run: cargo evin-dev run release:package-verify
      - name: Reconcile and publish the GitHub prerelease through EVIN
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.EVERYINIT_RELEASE_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "EVERYINIT_RELEASE_SIGNING_KEY secret is required to publish" >&2; exit 1; }
          key_file="$RUNNER_TEMP/everyinit-release-signing-key.pem"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_file"
          echo "RELEASE_SIGNING_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          cargo evin-dev run release:github-publish
