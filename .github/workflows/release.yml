name: Publish release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-mirror
  cancel-in-progress: false

jobs:
  discover:
    name: Find a newly merged release tag
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.candidate.outputs.found }}
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: candidate
        name: Find a release tag introduced by this main update
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: node scripts/release/find-merged-candidate.mjs "$PUSH_BEFORE" "$PUSH_AFTER"

  publish:
    name: Promote verified artifacts to canary
    needs: [discover]
    if: needs.discover.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      actions: read
      checks: read
      contents: write
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      RELEASE_BASE_SHA: ${{ github.event.before }}
      RELEASE_COMMIT: ${{ needs.discover.outputs.commit }}
      RELEASE_TAG: ${{ needs.discover.outputs.tag }}
      RELEASE_TARGET: x86_64-unknown-linux-musl
      RELEASE_VERSION: ${{ needs.discover.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Validate the tag and release label against the merged candidate
        id: candidate
        run: node scripts/release/validate-candidate.mjs "$RELEASE_TAG" "$RELEASE_VERSION" "$RELEASE_COMMIT" "$RELEASE_COMMIT" "$RELEASE_BASE_SHA"
      - name: Require the successful pre-merge unstable preview check
        uses: actions/github-script@v8
        env:
          RELEASE_COMMIT: ${{ needs.discover.outputs.commit }}
        with:
          script: |
            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.RELEASE_COMMIT,
              per_page: 100,
            });
            const preview = checks
              .filter((check) => check.name === "Unstable preview" && check.status === "completed")
              .sort((left, right) => right.id - left.id)[0];
            if (!preview || preview.conclusion !== "success") {
              core.setFailed(`No successful Unstable preview check exists for ${process.env.RELEASE_COMMIT}.`);
            }
      - name: Fetch and verify the exact unstable artifacts
        env:
          RELEASE_CHANNEL: unstable
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_LABEL: ${{ steps.candidate.outputs.label }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: node scripts/release/verify-mirror-candidate.mjs "$RELEASE_CHANNEL" "$RELEASE_VERSION" "$RELEASE_COMMIT" "$RELEASE_LABEL"
      - name: Verify both downloaded tar archives
        run: |
          cargo run --locked -p esh -- scripts/release/verify-archive.esh evin "$RELEASE_TARGET" "$RELEASE_VERSION" crates/evin/dist/github
          cargo run --locked -p esh -- scripts/release/verify-archive.esh esh "$RELEASE_TARGET" "$RELEASE_VERSION" crates/esh/dist/github
      - name: Install locked Wrangler dependencies
        run: npm ci
      - name: Prepare the protected release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.EVERYINIT_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "EVERYINIT_RELEASE_SIGNING_KEY is required to publish" >&2; exit 1; }
          umask 077
          key_file="$RUNNER_TEMP/everyinit-release-signing-key.pem"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_file"
          echo "RELEASE_SIGNING_KEY_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Publish GitHub Releases and promote the same archives to canary
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: canary
          RELEASE_COMMIT: ${{ needs.discover.outputs.commit }}
          RELEASE_LABEL: ${{ steps.candidate.outputs.label }}
          RELEASE_TAG: ${{ needs.discover.outputs.tag }}
          RELEASE_TARGET: x86_64-unknown-linux-musl
          RELEASE_VERSION: ${{ needs.discover.outputs.version }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare R2 credentials are required" >&2; exit 1; }
          cargo evin-dev run release:publish-prebuilt
      - name: Confirm the canary pointers resolve to the promoted release
        env:
          RELEASE_CHANNEL: canary
          RELEASE_COMMIT: ${{ needs.discover.outputs.commit }}
          RELEASE_LABEL: ${{ steps.candidate.outputs.label }}
          RELEASE_VERSION: ${{ needs.discover.outputs.version }}
        run: node scripts/release/verify-mirror-candidate.mjs "$RELEASE_CHANNEL" "$RELEASE_VERSION" "$RELEASE_COMMIT" "$RELEASE_LABEL" --check-pointer
